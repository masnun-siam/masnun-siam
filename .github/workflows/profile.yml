name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile.yml]

jobs:
  cards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme:
          - { name: light, options: "theme=default&hide_border=true" }
          - { name: dark, options: "theme=github_dark&hide_border=true" }
        item:
          - { name: stats, card: stats, options: "show_icons=true&count_private=true&include_all_commits=true" }
          - { name: langs, card: top-langs, options: "layout=compact&langs_count=8" }
          - { name: pin-ai-workflow, card: pin, options: "repo=ai-workflow" }
          - { name: pin-cc-profiles, card: pin, options: "repo=cc-profiles" }
          - { name: pin-typevocal, card: pin, options: "repo=typevocal" }
          - { name: pin-dpdc_balance_checker, card: pin, options: "repo=dpdc_balance_checker" }
          - { name: pin-clippy, card: pin, options: "repo=clippy" }
          - { name: pin-bd-govt-job-autofill, card: pin, options: "repo=bd-govt-job-autofill" }
    steps:
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: ${{ matrix.item.card }}
          options: username=masnun-siam&${{ matrix.item.options }}&${{ matrix.theme.options }}
          path: profile/${{ matrix.item.name }}-${{ matrix.theme.name }}.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.item.name }}-${{ matrix.theme.name }}
          path: profile/${{ matrix.item.name }}-${{ matrix.theme.name }}.svg

  commit:
    needs: cards
    # ponytail: commit whatever cards succeeded; a failed card keeps yesterday's SVG
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: profile
          merge-multiple: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile cards" || exit 0
          git push

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: masnun-siam
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
